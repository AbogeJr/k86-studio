[package]
name = "k86-studio"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
description = "Native configurator for the Attack Shark K86 keyboard"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
eframe = { version = "0.35", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui_extras = { version = "0.35", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
